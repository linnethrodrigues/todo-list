<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlist de Series y Cine</title>
    <link rel="stylesheet" href="./css/styles.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./assets/favicon/favicon-96x96.png?v=2" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg?v=2" />
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-title" content="Watchlist" />
    <link rel="manifest" href="./assets/favicon/site.webmanifest" />
</head>

<body>
    <header class="main-header">
        <h1 class="app-title">Watchlist de Cine y Series</h1>
    </header>
    <main class="main-container">
        <section class="form-section">
            <form class="watchlist-form">
                <label for="title-input" class="form-label">Añadir película o serie:</label>
                <div class="input-group">
                    <input type="text" id="title-input" name="title-input" class="form-input"
                        placeholder="Ej. Game of Thrones" required>
                    <button type="submit" class="btn btn-add">Añadir a la lista</button>
                </div>
            </form>
        </section>
        <section class="list-section">
            <h2 class="section-title">Películas y Series Guardadas</h2>
            <ul class="task-list">
                <li class="task-item">
                    <input type="checkbox" id="title-1" class="task-checkbox">
                    <img src="./assets/posters/house-of-the-dragon.jpg" alt="House of the Dragon" class="task-poster">
                    <label for="title-1" class="task-label">House of the Dragon</label>
                </li>
                <li class="task-item">
                    <input type="checkbox" id="title-2" class="task-checkbox">
                    <img src="./assets/posters/guardianes-galaxia-3.jpg" alt="Guardianes de la Galaxia Vol. 3"
                        class="task-poster">
                    <label for="title-2" class="task-label">Guardianes de la Galaxia Vol. 3</label>
                </li>
                <li class="task-item">
                    <input type="checkbox" id="title-3" class="task-checkbox">
                    <img src="./assets/posters/sense8.jpg" alt="Sense8" class="task-poster">
                    <label for="title-3" class="task-label">Sense8</label>
                </li>
                <li class="task-item">
                    <input type="checkbox" id="title-4" class="task-checkbox">
                    <img src="./assets/posters/casa-de-papel.jpg" alt="La casa de papel" class="task-poster">
                    <label for="title-4" class="task-label">La casa de papel</label>
                </li>
                <li class="task-item">
                    <input type="checkbox" id="title-5" class="task-checkbox">
                    <img src="./assets/posters/avengers-endgame.jpg" alt="Avengers: Endgame" class="task-poster">
                    <label for="title-5" class="task-label">Avengers: Endgame</label>
                </li>
                <li class="task-item">
                    <input type="checkbox" id="title-6" class="task-checkbox">
                    <img src="./assets/posters/avatar-2.jpg" alt="Avatar: El Sentido del Agua" class="task-poster">
                    <label for="title-6" class="task-label">Avatar: El Sentido del Agua</label>
                </li>
                <li class="task-item">
                    <input type="checkbox" id="title-7" class="task-checkbox">
                    <img src="./assets/posters/stranger-things.jpg" alt="Stranger Things" class="task-poster">
                    <label for="title-7" class="task-label">Stranger Things</label>
                </li>
                <li class="task-item">
                    <input type="checkbox" id="title-8" class="task-checkbox">
                    <img src="./assets/posters/spiderman-no-way-home.jpg" alt="Spider-Man: No Way Home" class="task-poster">
                    <label for="title-8" class="task-label">Spider-Man: No Way Home</label>
                </li>
                <li class="task-item">
                    <input type="checkbox" id="title-9" class="task-checkbox">
                    <img src="./assets/posters/wednesday.jpg" alt="Wednesday" class="task-poster">
                    <label for="title-9" class="task-label">Wednesday</label>
                </li>
                <li class="task-item">
                    <input type="checkbox" id="title-10" class="task-checkbox">
                    <img src="./assets/posters/jurassic-world.jpg" alt="Jurassic World" class="task-poster">
                    <label for="title-10" class="task-label">Jurassic World</label>
                </li>
            </ul>
            <div class="global-actions">
                <button type="button" class="btn btn-secondary">Eliminar vistas</button>
                <button type="button" class="btn btn-danger">Eliminar todas</button>
            </div>
        </section>
    </main>
    <footer class="main-footer">
        <p>&copy; Linneth Rodrigues</p>
    </footer>

</body>

</html>
