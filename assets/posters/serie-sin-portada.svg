<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient-serie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="neon-series" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow-series" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="400" height="600" fill="url(#bg-gradient-serie)"/>
  <rect width="380" height="580" x="10" y="10" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.3"/>
  
  <!-- Ilustración TV Serie -->
  <g transform="translate(100, 180)" filter="url(#glow-series)">
    <!-- Antenas -->
    <path d="M 60 40 L 20 0 M 140 40 L 180 0" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <!-- Cuerpo TV -->
    <rect x="20" y="40" width="160" height="120" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="5"/>
    <!-- Pantalla -->
    <rect x="35" y="55" width="95" height="90" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 45 70 L 115 130" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
    <!-- Botones -->
    <circle cx="150" cy="70" r="8" fill="#38bdf8"/>
    <circle cx="150" cy="95" r="8" fill="#38bdf8"/>
    <line x1="142" y1="125" x2="158" y2="125" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Texto -->
  <text x="200" y="420" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="700" letter-spacing="4">SERIE</text>
  <text x="200" y="450" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="14" letter-spacing="2">SIN PORTADA</text>
</svg>
