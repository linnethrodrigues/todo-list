<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient-movie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18072b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="neon-movie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="glow-movie" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="400" height="600" fill="url(#bg-gradient-movie)"/>
  <rect width="380" height="580" x="10" y="10" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="8 6" opacity="0.3"/>
  
  <!-- Ilustración Claqueta Película -->
  <g transform="translate(100, 180)" filter="url(#glow-movie)">
    <!-- Base Claqueta -->
    <rect x="20" y="70" width="160" height="110" rx="10" fill="#2e1065" stroke="#c084fc" stroke-width="5"/>
    <!-- Parte superior inclinada -->
    <g transform="rotate(-15, 20, 70)">
      <rect x="20" y="40" width="160" height="30" rx="6" fill="#2e1065" stroke="#c084fc" stroke-width="4"/>
      <path d="M 50 40 L 70 70 M 90 40 L 110 70 M 130 40 L 150 70" stroke="#c084fc" stroke-width="4"/>
    </g>
    <!-- Líneas decorativas en base -->
    <line x1="40" y1="110" x2="160" y2="110" stroke="#c084fc" stroke-width="3" opacity="0.5"/>
    <line x1="40" y1="135" x2="130" y2="135" stroke="#c084fc" stroke-width="3" opacity="0.5"/>
  </g>
  
  <!-- Texto -->
  <text x="200" y="420" text-anchor="middle" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="700" letter-spacing="4">PELÍCULA</text>
  <text x="200" y="450" text-anchor="middle" fill="#a78bfa" font-family="'Segoe UI', sans-serif" font-size="14" letter-spacing="2">SIN PORTADA</text>
</svg>
